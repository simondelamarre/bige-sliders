# Démo publique : construite depuis la dernière version npm de bige-sliders,
# servie par GitHub Pages sous /bige-sliders/.
name: Démo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer la démo depuis npm
        working-directory: demo
        run: npm install
      - name: Construire
        working-directory: demo
        env:
          DEMO_BASE: /bige-sliders/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
